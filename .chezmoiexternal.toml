[".config/nvim"]
  type = "git-repo"
  url = "https://github.com/drop-stones/nvim-config.git"
  refreshPeriod = "24h"

# Files shared with nix-config, which is the single source of truth.
# Edit them there; they are pulled from the main branch on refresh.

[".config/ripgrep/config"]
  type = "file"
  url = "https://raw.githubusercontent.com/drop-stones/nix-config/main/modules/home/shell/ripgrep/config/config.conf"
  refreshPeriod = "24h"

["AppData/Roaming/bat/themes/tokyonight_night.tmTheme"]
  type = "file"
  url = "https://raw.githubusercontent.com/drop-stones/nix-config/main/modules/home/shell/bat/themes/tokyonight_night.tmTheme"
  refreshPeriod = "24h"

[".config/tridactyl/theme.vim"]
  type = "file"
  url = "https://raw.githubusercontent.com/drop-stones/nix-config/main/modules/home/apps/firefox/tridactyl/config/theme.vim"
  refreshPeriod = "24h"

[".config/tridactyl/bind.vim"]
  type = "file"
  url = "https://raw.githubusercontent.com/drop-stones/nix-config/main/modules/home/apps/firefox/tridactyl/config/bind.vim"
  refreshPeriod = "24h"
